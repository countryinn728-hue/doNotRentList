<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Not Rent — Country Inn &amp; Suites</title>
<style>
  :root {
    --red: #d32f2f;
    --red-bg: #fdecec;
    --green: #2e7d32;
    --green-bg: #ecf6ed;
    --brand: #16324f;
    --brand-2: #1f6feb;
    --gray: #667085;
    --line: #e6e9ee;
    --card: #ffffff;
    --bg: #f2f4f7;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color: #1a1f29;
    font-size: 14px;
    line-height: 1.45;
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .status { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: #c9d6e5; }
  main { max-width: 880px; margin: 0 auto; padding: 18px 16px 48px; }

  /* Tabs */
  .tabbar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--gray);
    cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .tab:hover { filter: none; color: #344054; }
  .tab.active { color: var(--brand-2); border-bottom-color: var(--brand-2); }
  .tab .badge {
    font-size: 11px;
    font-weight: 700;
    background: #eef2f7;
    color: var(--gray);
    border-radius: 999px;
    padding: 1px 8px;
    min-width: 20px;
    text-align: center;
  }
  .tab.active .badge { background: rgba(31,111,235,.12); color: var(--brand-2); }

  .panel { display: none; }
  .panel.active { display: block; }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--gray);
  }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 12.5px; color: #344054; }
  input, textarea {
    width: 100%;
    padding: 9px 11px;
    font-size: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    background: #fff;
    transition: border-color .12s, box-shadow .12s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--brand-2);
    box-shadow: 0 0 0 3px rgba(31,111,235,.15);
  }
  textarea { resize: vertical; min-height: 52px; }
  button {
    font-size: 14px;
    padding: 9px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: filter .12s, transform .05s;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--brand-2); color: #fff; }
  .btn-secondary { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.28); padding: 6px 12px; font-size: 12.5px; }
  .btn-danger { background: #fff; color: var(--red); border: 1px solid #f0c2c2; font-size: 12.5px; padding: 5px 11px; }
  .btn-danger:hover { background: var(--red-bg); }

  /* Search area */
  #searchBox {
    font-size: 18px;
    padding: 13px 15px;
    border: 2px solid #d0d5dd;
    border-radius: 10px;
  }
  #searchBox:focus { border-color: var(--brand-2); }
  .result-banner {
    margin-top: 14px;
    padding: 16px 18px;
    border-radius: 10px;
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .3px;
    display: none;
  }
  .result-banner.match { display: block; background: var(--red-bg); color: var(--red); border: 2px solid var(--red); }
  .result-banner.ok { display: block; background: var(--green-bg); color: var(--green); border: 2px solid var(--green); }
  .match-card {
    text-align: left;
    background: #fff;
    border: 1px solid #f0c2c2;
    border-left: 4px solid var(--red);
    border-radius: 8px;
    padding: 11px 14px;
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 400;
    color: #1a1f29;
  }
  .match-card .name { font-size: 16px; font-weight: 800; color: var(--red); margin-bottom: 4px; }
  .match-card .field { margin-top: 3px; }
  .match-card .field b { color: var(--gray); font-weight: 700; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
  .confirm-msg { color: var(--green); font-weight: 700; font-size: 13px; }

  /* List table */
  .list-head { display: flex; align-items: baseline; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--gray); font-weight: 700; }
  tbody tr:hover td { background: #f8fafc; }
  td .nm { font-weight: 700; }
  .muted { color: var(--gray); font-size: 12px; }
  .empty { color: var(--gray); padding: 18px; text-align: center; }
  .required { color: var(--red); }

  /* Sign-in screen */
  #loginScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #loginScreen[hidden] { display: none; }
  .login-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 4px 16px rgba(16,24,40,.08);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 19px; color: var(--brand); }
  .login-card p { margin: 0 0 14px; color: var(--gray); font-size: 13px; }
  .login-card button { width: 100%; margin-top: 12px; }
  .login-error { color: var(--red); font-weight: 600; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .role-pill {
    background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px 10px;
    color: #fff; font-weight: 600;
  }

  @media (max-width: 560px) {
    .form-grid { grid-template-columns: 1fr; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>🚫 Do Not Rent List</h1>
    <p>Enter your passcode to continue.</p>
    <label for="passcode">Passcode</label>
    <input type="password" id="passcode" autocomplete="current-password" required>
    <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>

<header>
  <h1>🚫 Do Not Rent List</h1>
  <div class="status">
    <span id="lastUpdated">Loading…</span>
    <span class="role-pill" id="roleLabel"></span>
    <button class="btn-secondary" id="refreshBtn">↻ Refresh</button>
    <button class="btn-secondary" id="signOutBtn">Sign out</button>
  </div>
</header>

<main>
  <!-- ============================================================
       PASTE YOUR WEB APP URL BELOW (between the quotes).
       It looks like: https://script.google.com/macros/s/AKfyc.../exec
       ============================================================ -->
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOjyL-BTD6XlNg9dOyJB9OtWPb9o3yFX95aiVY4ulDYK2QbyyQN7bWK5qKrOVydWAZ/exec";
  </script>

  <!-- TABS -->
  <div class="tabbar" role="tablist">
    <button class="tab active" id="tab-search" data-panel="panel-search" role="tab">🔍 Search</button>
    <button class="tab" id="tab-add" data-panel="panel-add" role="tab">➕ Add</button>
    <button class="tab" id="tab-manage" data-panel="panel-manage" role="tab">
      📋 Manage <span class="badge" id="tabCount">0</span>
    </button>
  </div>

  <!-- SEARCH -->
  <div class="panel active" id="panel-search" role="tabpanel">
  <section>
    <h2>Search</h2>
    <input type="text" id="searchBox" placeholder="Type a guest's name…" autocomplete="off">
    <div class="result-banner" id="resultBanner"></div>
  </section>
  </div>

  <!-- ADD -->
  <div class="panel" id="panel-add" role="tabpanel">
  <section>
    <h2>Add to List</h2>
    <form id="addForm">
      <div class="form-grid">
        <div>
          <label>First name</label>
          <input type="text" id="firstName" autocomplete="off">
        </div>
        <div>
          <label>Last name</label>
          <input type="text" id="lastName" autocomplete="off">
        </div>
        <div class="full">
          <label>Reason <span class="required">*</span></label>
          <input type="text" id="reason" autocomplete="off" required>
        </div>
        <div class="full">
          <label>Notes (ID / license / phone / room — optional)</label>
          <textarea id="notes"></textarea>
        </div>
        <div>
          <label>Your initials (optional)</label>
          <input type="text" id="addedBy" autocomplete="off" maxlength="10">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="addBtn">Add to Do Not Rent List</button>
        <span class="confirm-msg" id="addConfirm"></span>
      </div>
    </form>
  </section>
  </div>

  <!-- LIST -->
  <div class="panel" id="panel-manage" role="tabpanel">
  <section>
    <div class="list-head">
      <h2>Full List</h2>
      <span class="muted" id="countLabel"></span>
    </div>
    <table id="listTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Reason</th>
          <th>Notes</th>
          <th>Added</th>
          <th>By</th>
          <th class="mgr-only"></th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="6" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </section>
  </div>
</main>

<script>
  // ---- In-memory copy of the list (fetched fresh on every load/refresh) ----
  let ROWS = [];
  let CODE = "";   // passcode for this PC (remembered in this browser)
  let ROLE = "";   // "staff" or "manager" — decided by the server

  const $ = (id) => document.getElementById(id);

  function norm(s) {
    return (s || "").toString().toLowerCase().replace(/\s+/g, " ").trim();
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString([], {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function esc(s) {
    return (s || "").toString()
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- Remember the passcode on this PC (safe if storage is blocked) ----
  function saveCode(code) { try { localStorage.setItem("dnr_code", code); } catch (e) {} }
  function loadCode() { try { return localStorage.getItem("dnr_code") || ""; } catch (e) { return ""; } }
  function clearCode() { try { localStorage.removeItem("dnr_code"); } catch (e) {} }

  // ---- One helper for every API call (all POST, passcode in the body) ----
  async function api(payload) {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ code: CODE }, payload))
    });
    const data = await res.json();
    if (data.auth === false) {
      // Passcode was changed or is wrong — send this PC back to sign-in.
      signOut("Passcode no longer valid. Please sign in again.");
      throw new Error("Not signed in");
    }
    if (!data.ok) throw new Error(data.error || "Server error");
    return data;
  }

  // ---- Sign in / sign out ----
  function applyRole(role) {
    ROLE = role;
    $("roleLabel").textContent = role === "manager" ? "Manager" : "Front desk";
    document.querySelectorAll(".mgr-only").forEach(function (el) {
      el.style.display = role === "manager" ? "" : "none";
    });
  }

  function showLogin(msg) {
    $("loginScreen").hidden = false;
    $("loginError").textContent = msg || "";
    $("passcode").value = "";
    $("passcode").focus();
  }

  function signOut(msg) {
    CODE = ""; ROLE = ""; ROWS = [];
    clearCode();
    $("listBody").innerHTML = "";
    $("resultBanner").className = "result-banner";
    $("searchBox").value = "";
    showLogin(msg);
  }

  async function signIn(e) {
    e.preventDefault();
    const code = $("passcode").value.trim();
    if (!code) return;
    $("loginBtn").disabled = true;
    $("loginError").textContent = "Checking…";
    try {
      CODE = code;
      const data = await api({ action: "login" });
      saveCode(code);
      applyRole(data.role);
      $("loginScreen").hidden = true;
      $("loginError").textContent = "";
      showTab("panel-search");
      loadList();
    } catch (err) {
      CODE = "";
      if (err.message !== "Not signed in") $("loginError").textContent = err.message;
      else $("loginError").textContent = "Wrong passcode.";
    } finally {
      $("loginBtn").disabled = false;
    }
  }

  // ---- Fetch the whole list from the API (no caching) ----
  async function loadList() {
    if (!CODE) return;
    $("lastUpdated").textContent = "Loading…";
    try {
      const data = await api({ action: "list" });
      applyRole(data.role);
      ROWS = data.rows || [];
      renderList();
      runSearch();
      $("lastUpdated").textContent = "Last updated: " + fmtDate(new Date().toISOString());
    } catch (err) {
      if (err.message === "Not signed in") return;
      $("lastUpdated").textContent = "⚠ Could not load list";
      $("listBody").innerHTML =
        '<tr><td colspan="6" class="empty">Error loading list: ' + esc(err.message) + '</td></tr>';
    }
  }

  // ---- Render the full list table ----
  function renderList() {
    const body = $("listBody");
    const isMgr = ROLE === "manager";
    $("countLabel").textContent = ROWS.length ? ROWS.length + (ROWS.length === 1 ? " entry" : " entries") : "";
    $("tabCount").textContent = ROWS.length;
    if (!ROWS.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">The list is empty.</td></tr>';
      return;
    }
    body.innerHTML = ROWS.map(function (r) {
      const name = (esc(r.first_name) + " " + esc(r.last_name)).trim() || "(no name)";
      return '<tr>' +
        '<td><span class="nm">' + name + '</span></td>' +
        '<td>' + esc(r.reason) + '</td>' +
        '<td>' + esc(r.notes) + '</td>' +
        '<td class="muted">' + esc(fmtDate(r.created_at)) + '</td>' +
        '<td class="muted">' + esc(r.added_by) + '</td>' +
        (isMgr ? '<td><button class="btn-danger" data-id="' + esc(r.id) + '">Delete</button></td>' : '') +
      '</tr>';
    }).join("");
  }

  // ---- Search: forgiving match on first + last name ----
  function runSearch() {
    const q = norm($("searchBox").value);
    const banner = $("resultBanner");
    if (!q) {
      banner.className = "result-banner";
      banner.innerHTML = "";
      return;
    }
    const words = q.split(" ");
    const matches = ROWS.filter(function (r) {
      const full = norm(r.first_name + " " + r.last_name);
      return words.every(function (w) { return full.indexOf(w) !== -1; });
    });

    if (matches.length) {
      banner.className = "result-banner match";
      let html = "⛔ DO NOT RENT — MATCH FOUND";
      matches.forEach(function (r) {
        const name = (esc(r.first_name) + " " + esc(r.last_name)).trim() || "(no name)";
        html += '<div class="match-card">' +
          '<div class="name">' + name + '</div>' +
          '<div class="field"><b>Reason:</b> ' + esc(r.reason) + '</div>' +
          (r.notes ? '<div class="field"><b>Notes:</b> ' + esc(r.notes) + '</div>' : '') +
          '<div class="field"><b>Added:</b> ' + esc(fmtDate(r.created_at)) +
            (r.added_by ? ' by ' + esc(r.added_by) : '') + '</div>' +
        '</div>';
      });
      banner.innerHTML = html;
    } else {
      banner.className = "result-banner ok";
      banner.innerHTML = "✅ No match — OK to rent";
    }
  }

  // ---- Add a new entry (front desk + manager) ----
  async function addEntry(e) {
    e.preventDefault();
    const reason = $("reason").value.trim();
    if (!reason) { alert("Reason is required."); return; }

    $("addBtn").disabled = true;
    $("addConfirm").textContent = "Saving…";
    try {
      await api({
        action: "add",
        first_name: $("firstName").value.trim(),
        last_name: $("lastName").value.trim(),
        reason: reason,
        notes: $("notes").value.trim(),
        added_by: $("addedBy").value.trim()
      });
      $("addForm").reset();
      $("addConfirm").textContent = "✅ Added.";
      await loadList();
      $("firstName").focus();
      setTimeout(function () { $("addConfirm").textContent = ""; }, 4000);
    } catch (err) {
      $("addConfirm").textContent = "";
      if (err.message !== "Not signed in") alert("Could not add entry: " + err.message);
    } finally {
      $("addBtn").disabled = false;
    }
  }

  // ---- Delete an entry (manager only — the server also enforces this) ----
  async function deleteRow(id) {
    const row = ROWS.find(function (r) { return r.id === id; });
    const label = row ? ((row.first_name + " " + row.last_name).trim() || "this entry") : "this entry";
    if (!confirm('Remove "' + label + '" from the Do Not Rent list?')) return;
    try {
      await api({ action: "delete", id: id });
      await loadList();
    } catch (err) {
      if (err.message !== "Not signed in") alert("Could not delete: " + err.message);
    }
  }
  $("listBody").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-id]");
    if (btn) deleteRow(btn.dataset.id);
  });

  // ---- Tab switching ----
  function showTab(panelId) {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.panel === panelId);
    });
    document.querySelectorAll(".panel").forEach(function (p) {
      p.classList.toggle("active", p.id === panelId);
    });
    if (panelId === "panel-search") $("searchBox").focus();
    if (panelId === "panel-add") $("firstName").focus();
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { showTab(t.dataset.panel); });
  });

  // ---- Wire up events ----
  $("loginForm").addEventListener("submit", signIn);
  $("signOutBtn").addEventListener("click", function () { signOut(); });
  $("searchBox").addEventListener("input", runSearch);
  $("addForm").addEventListener("submit", addEntry);
  $("refreshBtn").addEventListener("click", loadList);

  document.addEventListener("keydown", function (e) {
    if (!CODE) return;
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "TEXTAREA") {
      e.preventDefault();
      showTab("panel-search");
    }
  });

  // ---- On load: use the remembered passcode, or show sign-in ----
  window.addEventListener("load", function () {
    if (WEB_APP_URL.indexOf("PASTE_YOUR_WEB_APP_URL") === 0) {
      showLogin("⚠ Web App URL not set in index.html");
      return;
    }
    CODE = loadCode();
    if (!CODE) { showLogin(); return; }
    $("loginScreen").hidden = true;
    loadList().then(function () { if (CODE) $("searchBox").focus(); });
  });
</script>
</body>
</html>
